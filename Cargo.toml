[workspace]
members = [
    "crates/flowcore",
    "crates/flowcore_macros",
    "crates/flowpersist",
    "crates/flowruntime",
    "crates/flownodes",
    "crates/flowserver",
    "crates/flowcli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
petgraph = "0.8"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"
futures = "0.3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
